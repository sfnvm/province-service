name: build-and-deploy

# Test, publish the image to GHCR, then deploy through GitOps: the deploy job
# bumps the image tag in sfnvm/homelab (k8s/apps/province) and Argo CD in the
# homelab cluster rolls it out. CI never talks to the cluster.
#
# Required repo secret:
#   HOMELAB_DEPLOY_KEY – write deploy key on sfnvm/homelab ("province-service CI (write)")

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Private package on GHCR, pulled by the homelab cluster with an imagePullSecret.
  IMAGE: ghcr.io/sfnvm/province-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test
        run: ./gradlew --no-daemon test

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    concurrency:
      group: province-service-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit for /actuator/info
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_COMMIT=${{ steps.commit.outputs.short }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    concurrency:
      group: homelab-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout sfnvm/homelab
        uses: actions/checkout@v4
        with:
          repository: sfnvm/homelab
          ssh-key: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          path: homelab

      - name: Bump image tag
        working-directory: homelab
        env:
          MANIFEST: k8s/apps/province/province-service.yaml
        run: |
          set -euo pipefail
          sed -i -E "s|(image: ${IMAGE}):[A-Za-z0-9._-]+|\1:${GITHUB_SHA}|" "$MANIFEST"
          grep -n "image: ${IMAGE}:" "$MANIFEST"
          if git diff --quiet; then
            echo "Tag already ${GITHUB_SHA}, nothing to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "province: deploy province-service ${GITHUB_SHA::7}" \
            -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
      # No public smoke test: the service is internal-only (no HTTPRoute).
