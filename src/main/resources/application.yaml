spring:
  application:
    name: province
  datasource:
    url: jdbc:postgresql://postgres-rw.postgres.svc.cluster.local:5432/vietnamese_provinces
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Keep pooled connections warm and retire them before anything upstream reaps
      # them (mainly relevant off-cluster over WireGuard; harmless in-cluster).
      keepalive-time: 30000 # ping idle connections every 30s (Hikari minimum)
      max-lifetime: 300000 # retire a connection after 5 min
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    export:
      enabled: true   # ship traces to Alloy (local/dev profiles override to false)
    sampling:
      probability: 0.10
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://alloy.monitoring.svc.cluster.local:4318/v1/traces

server:
  shutdown: graceful

logging:
  structured:
    format:
      console: ecs   # JSON to stdout with trace_id/span_id
